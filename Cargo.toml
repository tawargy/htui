[package]
name = "herdr-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Keyboard-driven terminal multiplexer and client for herdr-core (hc)"
license = "Apache-2.0"

[lib]
name = "herdr_tui"
path = "src/lib.rs"

[[bin]]
name = "htui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "5"
futures = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
unicode-width = "0.2"
vt100 = "0.15"

[dev-dependencies]
insta = "1"
pretty_assertions = "1"
tempfile = "3"
